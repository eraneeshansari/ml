<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 4px 15px #ccc;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            color: green;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>House Price Prediction</h2>

    <label>Enter House Size (Sq.ft)</label>

    <input
        type="number"
        id="size"
        placeholder="Example: 2500"
        min="1"
        step="any"
    >

    <button onclick="predictPrice()">
        Predict Price
    </button>

    <div id="result"></div>

</div>

<script>

async function predictPrice() {

    const size = Number(
        document.getElementById("size").value
    );

    const result = document.getElementById("result");

    if (!Number.isFinite(size) || size <= 0) {
        result.innerText = "Please enter a valid size!";
        return;
    }

    result.innerText = "Predicting...";

    try {

        const response = await fetch("/predict", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                size: size
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Prediction failed");
        }

        result.innerHTML =
            "Predicted Price: ₹" +
            data.predicted_price +
            " Lakh";

    } catch (error) {

        result.innerText = error.message;

    }
}

</script>

</body>
</html>
